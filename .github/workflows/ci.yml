name: CI

on:
  push:
    branches: [main]
  pull_request:

# Code review finding: without this, jobs inherit the repo/org default
# token permissions, which can be write-all. Neither job here needs to
# write anything.
permissions:
  contents: read
  # gitleaks-action lists the PR's commits (GET /pulls/{number}/commits)
  # on pull_request events. Without this it 403s with "Resource not
  # accessible by integration", so the scan failed on every PR while
  # passing on push — read access to pull requests is all it needs.
  pull-requests: read

# ADR 0014 §7-8 (T5.11): lint/typecheck/tests + Postgres 18 service +
# dependency and secret scanning, on every push and PR.
jobs:
  checks:
    name: Lint, typecheck, tests, dependency audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: samkvetlo_ci
        ports:
          - 5432:5432
        # pg_isready health gate: the job's steps don't start until this
        # passes, so `payload migrate` below never races container startup.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/samkvetlo_ci
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/samkvetlo_ci
      PAYLOAD_SECRET: ci-not-a-real-secret-0000000000000000000000
      BACKEND_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000
      FRONTEND_REVALIDATE_URL: http://localhost:3000/api/revalidate
      REVALIDATE_SECRET: ci-revalidate-secret
      SERVICE_TOKEN_READ: ci-read-token
      SERVICE_TOKEN_WRITE: ci-write-token
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      EMAIL_ADAPTER: console
      SMS_ADAPTER: console
      CRON_SECRET: ci-cron-secret
      IP_HASH_SALT: ci-salt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:ka
      # Code review finding: importMap.js is generated (`pnpm
      # generate:importmap`) and read as-is by production builds — a custom
      # admin component registered without regenerating it silently doesn't
      # render (this happened once already, AnonymizeButton/T5.12).
      - run: pnpm check:importmap
      - run: pnpm test:unit

      # Applies the committed migrations (not the dev-only schema push that
      # getPayload() does locally) so test:int runs against the same schema
      # Vercel's build produces (ADR 0012 §7, ADR 0014 §9).
      - run: pnpm payload migrate
      # Code review finding: guards against the migration snapshot chain
      # drifting from src/payload.config.ts (a later .json losing tables an
      # earlier one had) — the next migrate:create would then try to
      # re-create things that already exist in prod.
      - run: pnpm check:migrations
      # ADR 0018 addendum A (T5.17a): off here (unlike local dev, where
      # push's speed is worth it) so a migration gap — schema push papering
      # over a config change the committed migrations never actually
      # capture — fails this job instead of only surfacing on a real
      # migrate-driven deploy.
      # The postgres service container has no volume, so if it restarts
      # mid-job its init re-runs and samkvetlo_ci comes back empty. The job
      # keeps going against that empty database and every DB-backed test
      # fails with `relation ... does not exist` — 34 of 47 files in run
      # 35493350241, which then passed on a plain re-run with no code
      # change (same for run 35493395598). `payload migrate` and
      # `check:migrations` above had both already succeeded against the
      # schema, so it was there and then gone.
      #
      # Root cause is inferred, not proven — it is not reproducible
      # locally. This re-checks the schema immediately before the tests and
      # re-applies the migrations if it vanished, so a transient reset
      # self-heals and is named in the log instead of surfacing as a mass
      # test failure. A genuine migration problem still fails the step,
      # because `payload migrate` itself would fail.
      - name: Integration tests
        run: |
          if [ "$(psql "$DATABASE_URL" -tAc "select to_regclass('public.site_settings') is not null")" != "t" ]; then
            echo "::warning::samkvetlo_ci lost its schema after 'payload migrate' — the postgres service container most likely restarted. Re-applying migrations."
            pnpm payload migrate
          fi
          pnpm test:int
        env:
          PAYLOAD_DB_PUSH: 'false'

      - run: pnpm audit --prod --audit-level high

      - name: No secret-shaped NEXT_PUBLIC_* names in source
        run: |
          if grep -RInE 'NEXT_PUBLIC_[A-Z_]*(SECRET|TOKEN|PASSWORD)' src; then
            echo '::error::A NEXT_PUBLIC_* name looks like a secret (ADR 0014 §7) — it would ship to the client bundle.'
            exit 1
          fi

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
